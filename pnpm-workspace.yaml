packages:
  - packages/*
  - apps/*

# Scripts d'installation : @scarf/scarf (télémétrie tirée par Prism) est refusé ;
# @swc/core et esbuild n'en ont pas besoin (binaire fourni par une dépendance optionnelle) ;
# celui de @apollo/protobufjs (tiré par @apollo/server) n'affiche qu'un avertissement de version
allowBuilds:
  '@apollo/protobufjs': false
  '@scarf/scarf': false
  '@swc/core': false
  esbuild: false

minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.12.0'
  - '@astrojs/markdown-satteri@0.4.3'
  - astro@7.3.6
  - svelte@5.57.2

# Forcer les versions corrigées des dépendances transitives (avis de sécurité)
overrides:
  multer: '>=2.5.0'
