# Production : base, API et front, construits depuis les Dockerfile des apps. Depuis ce dossier :
#   JWT_SECRET=<secret> docker compose up -d --build
#   front : http://localhost:4321   API : http://localhost:8080/api
# Variables (shell ou .env à la racine) : JWT_SECRET, JWT_REFRESH_SECRET (obligatoires), DB_PASSWORD,
# FRONT_URL et PUBLIC_API_BASE_URL (adresses publiques, si autres que localhost).
# Développement : compose.dev.yaml (base seule) et `pnpm dev`.
name: room-booking

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-resa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
      POSTGRES_DB: ${DB_NAME:-resa_db}
    # Pas de port publié : seule l'API accède à la base
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-resa_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
      DB_NAME: ${DB_NAME:-resa_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET est obligatoire}
      PEPPER_SECRET: ${PEPPER_SECRET:?PEPPER_SECRET est obligatoire}
      # Origine du front autorisée par le CORS
      CORS_ORIGIN: ${FRONT_URL:-http://localhost:4321}
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: wget -qO- http://127.0.0.1:8080/api || exit 1
      interval: 5s
      retries: 30

  front:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
      args:
        # Adresse de l'API vue par le navigateur
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    restart: unless-stopped
    environment:
      # Adresse de l'API vue par le serveur Astro (réseau interne de compose)
      API_BASE_URL: http://backend:8080/api
    ports:
      - '4321:4321'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
