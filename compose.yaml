# Travailler sans installer Node : seul Docker est nécessaire. Depuis ce dossier :
#   docker compose run --rm node pnpm core:sync  # une commande au choix
#   docker compose run --rm node                 # toutes les vérifications (pnpm check)
#   docker compose up mock                       # API mock sur http://localhost:4010
#   docker compose up dev                        # mock + serveur de dev de l'application
#   docker compose up -d db                      # PostgreSQL du back-end sur localhost:5432
# Les dépendances sont installées automatiquement à chaque lancement.

# Configuration commune aux trois services
x-node: &node
  build: .
  environment:
    # Cache pnpm dans son volume (sinon pnpm le crée dans le dossier du projet)
    pnpm_config_store_dir: /home/node/.local/share/pnpm/store
    # Détection des modifications faites depuis Windows ou macOS
    CHOKIDAR_USEPOLLING: 'true'
    WATCHPACK_POLLING: 'true'
    VITEST_POLLING: '1'
  entrypoint:
    - sh
    - -c
    - pnpm install --reporter=silent && exec "$$@"
    - --
  volumes:
    - .:/app
    - pnpm-store:/home/node/.local/share/pnpm
    - cache:/home/node/.cache

services:
  node:
    <<: *node
    command: [pnpm, check]

  mock:
    <<: *node
    command: [pnpm, mock]
    # Les ports du serveur de dev sont publiés ici, car `dev` partage le réseau de `mock`
    ports:
      - '4010:4010' # mock Prism
      - '3000:3000' # Next.js, Nuxt
      - '4200:4200' # Angular
      - '5173:5173' # Vite (Vue, Svelte, SolidStart…)
      - '4321:4321' # Astro
    # Prêt quand Prism écoute (donc après le pnpm install)
    healthcheck:
      test: nc -z 127.0.0.1 4010
      interval: 2s
      retries: 60

  dev:
    <<: *node
    # Pas de pnpm install ici : le service mock vient de le faire
    entrypoint: []
    command: [pnpm, dev]
    # Même réseau que le mock : http://localhost:4010 fonctionne aussi côté serveur (SSR)
    network_mode: service:mock
    depends_on:
      mock:
        condition: service_healthy

  # Base du back-end (apps/backend). Identifiants : valeurs par défaut de src/database/data-source.ts
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-resa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-resa_password}
      POSTGRES_DB: ${DB_NAME:-resa_db}
    ports:
      # DB_PORT=5433 docker compose up db si le port 5432 est déjà pris
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      retries: 30

volumes:
  pnpm-store:
  cache:
  pgdata:
